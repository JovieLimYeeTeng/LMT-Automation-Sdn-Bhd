<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TMS HR attendance prototype for single-user local attendance management."
    />
    <title>TMS HR Prototype</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("tms-lang");
          if (stored === "en") {
            document.documentElement.lang = "en";
          }
        } catch (e) {
          /* ignore storage errors */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
