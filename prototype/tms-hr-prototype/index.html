    <title>TMS HR Prototype</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("tms-lang");

            document.documentElement.lang = "en";
          }
        } catch (e) {
          /* ignore storage errors */
        }
      })();
    </script>
